name: MINI-TASKS-PROJET

on:
  push:
    branches: ['main', 'develop']
    paths-ignore: 
      - 'db.sqlite3'

  pull_request:
    branches: ['main', 'develop']
    paths-ignore: 
      - 'db.sqlite3'
    types:
      - 'opened'
      - 'synchronize'

jobs:
  deploiment-auto-et-PR:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 2
      fail-fast: true
      matrix:
        python-version: ['3.10', '3.11']
        os: [ubuntu-latest, windows-latest]

    env:
      DB_NAME: "minitasks_db_test"
      SECRET_KEY: "django-insecure-o=fmay0bdk6q$=k+o3glf+ggsld2y=js!+90o(02e@fy)#283a"
      DB_PASSWORD: ${{ secrets.DB_PRODUCTION_PASSWORD }}

    steps:
      - name: Telecharger le code source dans le runner
        uses: actions/checkout@v4

      - name: Configurer Python avec la version de la matrice
        uses: actions/setup-python@v5
        with: 
          python-version: ${{ matrix.python-version }}

      - name: Installer les dependances du projet Django
        run: |
          pip install --upgrade pip
          pip install -r minitask/requirements.txt

      - name: Lancer les tests Django et generer un rapport
        run: |
          mkdir -p reports
          echo "On lance les tests unitaires et on redirige la sortie dans un fichier texte"
          python minitask/manage.py test > reports/rapport_test.txt

      - name: Sauvegarder le rapport de test en Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rapport-test-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/rapport_test.txt

  deploiment:
    needs: deploiment-auto-et-PR
    runs-on: ubuntu-latest

    steps:
      - name: deploiment 
        if: github.ref_name == 'main' && github.actor == 'boazkalonji962'
        run: |
          echo "DEPLOIMENT SUR RENDER....."

      - name: telechargement du rapport 
        uses: actions/download-artifact@v4
        with: 
          name: rapport-test-ubuntu-latest-py3.10
          path: reports

      - name: visualisation du rapport dans le consol
        run: |
          echo "RESULTATS"
          cat reports/rapport_test.txt