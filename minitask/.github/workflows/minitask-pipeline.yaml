name: MINI-TASKS-PROJET

on:

  push:

    branches: ['main', 'develop']
    paths-ignore: 
      - 'db.sqlite3'


  pull_request:

    branches: ['main', 'develop']
    paths-ignore: 
      - 'db.sqlite3'
    types:
      - 'opened'
      - 'synchronize'


jobs:

  deploiment-auto-et-PR:

    runs-on: ${{ matrix.os }}

    strategy:

      max-parallel: 2
      fail-fast: true
      matrix:
        python-version: ['3.10', '3.11']
        os: [ubuntu-latest, windows-latest]

    env:
      DB_NAME: "minitasks_db_test"
      DB_PASSWORD: ${{ secrets.DB_PRODUCTION_PASSWORD }}

    outputs:
      STATUS: ${{ steps.test-deploiement.outputs.STATUS}}



  steps:

    - name: Telecharger le code source dans le runner
      uses: actions/checkout@v4

    - name: Configurer Python avec la version de la matrice
      uses: actions/setup-python@v5
        with: 
          python-version: ${{ matrix.python-version }}

    - name: Installer les dependances du projet Django
      run: |
       pip install --upgrade pip
       pip install -r requirements.txt

    - name: Lancer les tests Django et generer un rapport
      run: |

      mkdir -p reports
      echo "On lance les tests unitaires et on redirige la sortie dans un fichier texte"
      python manage.py tests> reports/rapport_test.txt

    - name: Sauvegarder le rapport de test en Artifact
      id: test-deploiement
      uses: actions/upload-artifact@v4
       with:
        name: rapport-test-${{ matrix.os }}-py${{ matrix.python-version }}
        path: reports/rapport_test.txt

    - name: chargement de la variable test
      run: |
       # pour savoir si tout est ok pour deployer 
       echo "STATUS = succes" >> $GITHUB_OUTPUT


  deploiment:
    needs: deploiment-auto-et-PR
    runs-on: ubuntu-latest

    steps:

      - name: deploiment 
        if: needs.deploiment-auto-et-PR.outputs.STATUS == 'succes' && github.ref_name == 'main' && github.actor == 'boazkalonji962'

        run: |
         echo "DEPLOIMENT SUR RENDER....."

      - name: telechargement du rapport 
        uses: actions/download-artifact@v4
         with: 
          name: rapport-test-ubuntu-latest-py3.10

      - name: visualisation du rapport dans le consol
        run: |
         echo "RESULTATS"
         cat reports/rapport_test.txt